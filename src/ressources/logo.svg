<svg width="1200" height="1200" viewBox="0 0 800 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="220" y1="250" x2="580" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="50%" stop-color="#00D9B8"/>
      <stop offset="100%" stop-color="#B4FF4A"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="380" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D9B8"/>
      <stop offset="100%" stop-color="#7CFF6B"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Symbol -->
  <g filter="url(#glow)">
    <!-- Outer Shape -->
    <path d="M400 260L560 360V450L480 405V610L400 660L320 610V405L240 450V360L400 260Z"
          fill="url(#logoGradient)"/>

    <!-- Inner Cutout -->
    <path d="M400 330L500 390V455L445 425V560L400 590L355 560V425L300 455V390L400 330Z"
          fill="#000000"/>

    <!-- Left Arm -->
    <path d="M240 360L320 405V470L280 495L240 450V360Z"
          fill="url(#logoGradient)" opacity="0.85"/>

    <!-- Right Arm -->
    <path d="M560 360L480 405V470L520 495L560 450V360Z"
          fill="url(#logoGradient)" opacity="0.85"/>
  </g>
</svg>
